[package]
name = "icloud-calendar-private-api"
version = "1.2.0"
edition = "2021"
authors = ["Ante de Baas <ante@debaas.net>"]
description = "iCloud Calendar Private API - Expose iCloud calendars via REST API"
repository = "https://github.com/antedebaas/icloud-calendar-private-api"
license = "MIT"
keywords = ["icloud", "calendar", "caldav", "api", "ical"]
categories = ["web-programming", "api-bindings"]

[[bin]]
name = "icloud-calendar-private-cli"
path = "src/main.rs"

[[bin]]
name = "icloud-calendar-private-api"
path = "src/server.rs"

[dependencies]
reqwest = { version = "0.11", features = ["json", "cookies"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = "0.4"
xml-rs = "0.8"
base64 = "0.21"
url = "2.4"
clap = { version = "4.4", features = ["derive"] }
urlencoding = "2.1"

# Web server dependencies
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "auth"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
